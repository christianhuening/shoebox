name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install sqld v0.24.32
        run: |
          set -eux
          cd /tmp
          wget -q https://github.com/tursodatabase/libsql/releases/download/libsql-server-v0.24.32/libsql-server-x86_64-unknown-linux-gnu.tar.xz
          echo "71720fc8648c19efef416efebd47145ef59b62e198770533530a858e1336879f  libsql-server-x86_64-unknown-linux-gnu.tar.xz" | sha256sum -c -
          tar -xJf libsql-server-x86_64-unknown-linux-gnu.tar.xz
          sudo install -m 755 libsql-server-x86_64-unknown-linux-gnu/sqld /usr/local/bin/sqld
          sqld --version
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        run: docker build -t shoebox-server:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shoebox-server:smoke .
      - name: Prep env
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          echo "SHOEBOX_SECRET=$(openssl rand -base64 24)" >> .env
          PHOTOS_DIR=$(mktemp -d)
          echo "SHOEBOX_PHOTOS_DIR=${PHOTOS_DIR}" >> .env
          # Bind health server to all interfaces so the host curl can reach it.
          echo "SHOEBOX_HEALTH_BIND_ADDR=0.0.0.0:9001" >> .env
          # Pin the locally-built image so we don't pull from ghcr.
          sed -i 's|image: ghcr.io/CHANGE-ME-OWNER/shoebox-server:v0.1.0|image: shoebox-server:smoke|' docker-compose.yml
      - name: Compose up
        working-directory: deploy/compose
        run: docker compose up -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9001/health >/dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          docker compose -f deploy/compose/docker-compose.yml logs
          exit 1
      - name: Compose down
        if: always()
        working-directory: deploy/compose
        run: docker compose down -v

  binary-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.85.0, targets: x86_64-unknown-linux-gnu }
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu -p shoebox-server
      - name: Package tarball
        env:
          TARGET: x86_64-unknown-linux-gnu
          VERSION: v0.0.0-ci
        run: bash .github/release/package-linux-amd64.sh
      - name: Verify tarball contents
        run: |
          tar -tJf dist/shoebox-server-v0.0.0-ci-linux-amd64.tar.xz > /tmp/tarball.list
          # Catch accidental drops of bundled artifacts.
          for required in \
              "shoebox-server-v0.0.0-ci-linux-amd64/bin/shoebox-server" \
              "shoebox-server-v0.0.0-ci-linux-amd64/bin/sqld" \
              "shoebox-server-v0.0.0-ci-linux-amd64/share/systemd/shoebox-server.service" \
              "shoebox-server-v0.0.0-ci-linux-amd64/share/openrc/shoebox-server" \
              "shoebox-server-v0.0.0-ci-linux-amd64/share/config.example.toml" \
              "shoebox-server-v0.0.0-ci-linux-amd64/README.md" \
              "shoebox-server-v0.0.0-ci-linux-amd64/LICENSE"; do
            grep -qF "${required}" /tmp/tarball.list || { echo "MISSING from tarball: ${required}"; exit 1; }
          done
          echo "tarball contents OK"
      - name: Extract
        run: |
          mkdir -p smoke
          tar -xJf dist/shoebox-server-v0.0.0-ci-linux-amd64.tar.xz -C smoke
      - name: Run + health check
        run: |
          SHOEBOX_SECRET=$(openssl rand -base64 24)
          SHOEBOX_DATA_DIR=$(mktemp -d)
          SHOEBOX_PHOTOS_DIR=$(mktemp -d)
          SHOEBOX_CACHE_DIR=$(mktemp -d)
          SHOEBOX_SQLD_PATH=$(pwd)/smoke/shoebox-server-v0.0.0-ci-linux-amd64/bin/sqld
          export SHOEBOX_SECRET SHOEBOX_DATA_DIR SHOEBOX_PHOTOS_DIR SHOEBOX_CACHE_DIR SHOEBOX_SQLD_PATH
          ./smoke/shoebox-server-v0.0.0-ci-linux-amd64/bin/shoebox-server &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9001/health >/dev/null; then
              echo "healthy after ${i}s"
              kill ${SERVER_PID} 2>/dev/null || true
              wait ${SERVER_PID} 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy"
          kill ${SERVER_PID} 2>/dev/null || true
          exit 1
