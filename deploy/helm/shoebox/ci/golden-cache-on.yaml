# Source: shoebox/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: release-shoebox-bootstrap
  labels:
    helm.sh/chart: shoebox-0.1.0
    app.kubernetes.io/name: shoebox
    app.kubernetes.io/instance: release
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Keep the bootstrap secret across `helm uninstall` so client certs
    # signed by the existing CA continue to authenticate after reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  SHOEBOX_SECRET: "<REDACTED>"

