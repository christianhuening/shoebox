---
# Source: shoebox/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-shoebox
  labels:
    helm.sh/chart: shoebox-0.1.0
    app.kubernetes.io/name: shoebox
    app.kubernetes.io/instance: release
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shoebox
      app.kubernetes.io/instance: release
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shoebox
        app.kubernetes.io/instance: release
    spec:
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: shoebox-server
          image: "ghcr.io/CHANGE-ME-OWNER/shoebox-server:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: mtls
              containerPort: 9000
              protocol: TCP
            - name: health
              containerPort: 9001
              protocol: TCP
          env:
            - name: SHOEBOX_HEALTH_BIND_ADDR
              value: "0.0.0.0:9001"
            - name: SHOEBOX_LOG
              value: debug
          envFrom:
            - secretRef:
                name: release-shoebox-bootstrap
          volumeMounts:
            - name: data
              mountPath: /var/lib/shoebox
            - name: cache
              mountPath: /shoebox-cache
            - name: photos
              mountPath: /photos
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: release-shoebox-data
        - name: cache
          persistentVolumeClaim:
            claimName: release-shoebox-cache
        - name: photos
          persistentVolumeClaim:
            claimName: my-photos-pvc
        - name: tmp
          emptyDir: {}
