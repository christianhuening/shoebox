{{- if .Values.secret.create }}
{{- /*
On helm upgrade, reuse the existing secret value if present so client
certs that were signed by the CA derived from the original SHOEBOX_SECRET
continue to authenticate. randAlphaNum only fires on first install.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "shoebox.secretName" .) -}}
{{- $value := "" -}}
{{- if and $existing $existing.data (index $existing.data .Values.secret.key) -}}
{{- $value = index $existing.data .Values.secret.key -}}
{{- else -}}
{{- $value = randAlphaNum 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shoebox.secretName" . }}
  labels:
    {{- include "shoebox.labels" . | nindent 4 }}
  annotations:
    # Keep the bootstrap secret across `helm uninstall` so client certs
    # signed by the existing CA continue to authenticate after reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.secret.key }}: {{ $value | quote }}
{{- end }}
