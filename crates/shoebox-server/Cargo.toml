[package]
name = "shoebox-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "shoebox_server"
path = "src/lib.rs"

[[bin]]
name = "shoebox-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
shoebox-common = { path = "../shoebox-common" }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
libsql = { workspace = true }
mdns-sd = { workspace = true }
include_dir = { workspace = true }
hostname = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }
axum-server = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
clap = { workspace = true }
x509-parser = { workspace = true }
time = { workspace = true }
hex = { workspace = true }
if-addrs = { workspace = true }
parking_lot = { workspace = true }
# Data-plane deps (Task 1 of Plan 1.3)
notify = { workspace = true }
blake3 = { workspace = true }
rawler = { workspace = true }
image = { workspace = true }
prometheus = { workspace = true }
tokio-tungstenite = { workspace = true }
walkdir = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
# Optional — only enabled via the `test-helpers` feature. Hoisted from
# dev-dependencies so the `test_helpers` module can use `tempfile` when
# downstream crates compile this crate's tests with `features = ["test-helpers"]`.
tempfile = { version = "3", optional = true }

[features]
default = []
# Re-export integration-test helpers (`shoebox_server::test_helpers::TestDb`).
# Enabled by `shoebox-client`'s dev-dependencies so the client's integration
# tests can spawn a sqld-backed Db with one call.
test-helpers = ["dep:tempfile"]

[dev-dependencies]
reqwest = { workspace = true }
rcgen = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
which = "6"
