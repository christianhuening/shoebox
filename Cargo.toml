[workspace]
resolver = "2"
members = [
    "crates/shoebox-common",
    "crates/shoebox-server",
    "crates/shoebox-client",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/CHANGE-ME/shoebox"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic exceptions that fight ergonomic Rust in this codebase:
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
libsql = { version = "0.9", default-features = false, features = ["core", "replication", "remote", "tls"] }
mdns-sd = "0.11"
include_dir = "0.7"
hostname = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
if-addrs = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
argon2 = "0.5"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
x509-parser = "0.16"
time = { version = "0.3", features = ["std", "formatting", "parsing"] }
hex = "0.4"
parking_lot = "0.12"
# Data-plane deps (Task 1 of Plan 1.3)
# NOTE: libsql-server is not published on crates.io; it is a binary-only workspace
# crate in tursodatabase/libsql with internal path deps. Embedding sqld in-process
# (Task 2) will be deferred to a git-dep or subprocess approach decided at Task 2 time.
notify = "6"
blake3 = "1"
rawler = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
prometheus = { version = "0.13", default-features = false }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
walkdir = "2"
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
# Desktop client deps (Plan 1.4 Task 1)
iced = { version = "0.13", default-features = false, features = ["wgpu", "tokio", "advanced", "image"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-async-persistent", "crypto-rust", "tokio"] }
lru = "0.12"
directories = "5"

